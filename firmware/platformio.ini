; Calamaio OS · firmware
; Un env per scheda, più `native` per i test della logica pura (src/core, src/gfx).

[platformio]
default_envs = heltec213

[env]
monitor_speed = 115200
test_framework = unity

; Heltec Wireless Paper V1.2 · ESP32-S3, 8 MB, pannello E0213A367 250×122
; La scheda non ha una definizione propria: si usa la Wireless Stick V3 (stesso S3 con 8 MB),
; come indicato dalla libreria heltec-eink-modules. Vedi docs/HARDWARE.md.
[env:heltec213]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
; Giochi Game Boy (piano B): app 2,25 MB ciascuna, «gbrom» 2 MB. NVS invariata. Si installa una volta via cavo.
board_build.partitions = partitions_gb.csv
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D WIRELESS_PAPER
  -D CALAMAIO_BOARD_HELTEC213
  ; Controller (piano A giochi): NimBLE solo centrale, una connessione (come spikes/blepad)
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  ; 0.12.0, memoria della partita (docs/DECISIONI.md «NimBLE più leggero»): pool di NimBLE ridotti per un solo
  ; controller con MTU 23 (notifiche da 16 byte, report map da 283 byte letto a pezzi da 22)
  -D CONFIG_BT_NIMBLE_MSYS_1_BLOCK_SIZE=128
  -D CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=6
  -D CONFIG_BT_NIMBLE_MAX_CCCDS=1
  ; 0.14.1: la scheda è solo centrale; il pool delle scritture preparate serve al suo server GATT (solo GAP/GATT):
  ; 2 voci invece di 64 (−744 B). Una scrittura lunga ricevuta oltre 2 pezzi ha «coda piena» dall'ATT.
  -D MYNEWT_VAL_BLE_ATT_SVR_MAX_PREP_ENTRIES=2
  ; 0.14.1, memoria: WebSocket senza TLS (la scheda usa solo ws:// e http://). 5 = NETWORK_ESP32_ETH di
  ; links2004/WebSockets 2.7.3: WiFiClient senza WiFiClientSecure (−121 KB di flash, −1 008 B di RAM statica)
  -D WEBSOCKETS_NETWORK_TYPE=5
  ; il tipo 5 non lo definisce (il 4 sì): setTimeout del core 2.x è in secondi, senza questo 5000 = 5000 s
  -D NETWORK_SET_TIMEOUT_IN_SECONDS
build_src_filter = +<*> -<demo/>
lib_deps =
  https://github.com/todd-herbert/heltec-eink-modules.git#v4.6.0
  bblanchon/ArduinoJson@7.4.3
  links2004/WebSockets@2.7.3
  h2zero/NimBLE-Arduino@2.5.1

[env:native]
platform = native
build_src_filter = -<*> +<core/> +<gfx/> +<ui/>
test_build_src = yes
build_flags = -std=c++17
; ArduinoJson serve anche in native: la conversione JSON → modello (core/apply_state) si prova qui.
lib_deps =
  bblanchon/ArduinoJson@7.4.3

; Come native, con AddressSanitizer e UBSan, solo sui test dei temi: serve a vedere le letture fuori dai byte
; (test_theme_format). -fno-sanitize-recover: un comportamento indefinito ferma il test invece di stampare e passare.
[env:native_asan]
extends = env:native
test_filter = test_theme_*
build_flags =
  ${env:native.build_flags}
  -fsanitize=address,undefined
  -fno-sanitize-recover=undefined
  -fno-omit-frame-pointer

; Prova dal vivo del driver veloce (piano A, Task 5 e 6): NON è il firmware Calamaio. Si scrive solo app0 (e otadata),
; NVS e LittleFS restano intatte. Vedi src/demo/fastink_demo.cpp.
[env:fastink-demo]
extends = env:heltec213
build_src_filter = -<*> +<core/fastink_engine.cpp> +<hw/fastink.cpp> +<gfx/text.cpp> +<demo/>
