<script>
class Component extends DCLogic {
  static build() {
    const HW = [1, 1, 2, 2, 3, 4, 5, 6, 7, 7, 8, 8, 8, 8, 8, 7, 7, 6, 4];
    function mascot(c, ox, oy, s, st, f, ink, paper) {
      const fr = ((f % 4) + 4) % 4;
      const P = (x, y, col) => { c.fillStyle = col; c.fillRect(ox + x * s, oy + y * s, s, s); };
      const I = (x, y) => P(x, y, ink), O = (x, y) => P(x, y, paper);
      const top = 4, cx = 13;
      for (let r = 0; r < HW.length; r++) { const h = HW[r]; for (let x = cx - h; x < cx + h; x++) I(x, top + r); }
      I(9, top + 19); I(10, top + 19); I(15, top + 19); I(16, top + 19);
      const ey = top + 9;
      const eye = (ex, k) => {
        if (k === 'closed') { for (let x = 0; x < 4; x++) O(ex + x, ey + 2); return; }
        for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) O(ex + x, ey + y);
        let px = ex + 1, py = ey + 1;
        if (k === 'down') py = ey + 2; else if (k === 'up') { py = ey; px = ex + 2; }
        I(px, py); I(px + 1, py); I(px, py + 1); I(px + 1, py + 1);
      };
      const eyes = (k) => { eye(7, k); eye(15, k); };
      const mouth = (k) => {
        const y = top + 14;
        if (k === 'o') { O(12, y); O(13, y); O(12, y + 1); O(13, y + 1); }
        else { O(11, y + 1); O(12, y + 1); O(13, y + 1); O(14, y + 1); }
      };
      const arm = (k, side) => {
        const mm = side < 0 ? ((x) => 25 - x) : ((x) => x), A = (x, y) => I(mm(x), top + y);
        if (k === 'rest') { A(21, 13); A(22, 14); }
        else if (k === 'type') { A(21, 13); A(22, 13); }
        else if (k === 'droop') { A(21, 14); A(22, 15); }
      };
      const bubble = () => {
        for (let x = 19; x <= 25; x++) { I(x, 0); I(x, 6); }
        for (let y = 1; y <= 5; y++) { I(18, y); I(26, y); }
        for (let y = 1; y <= 5; y++) for (let x = 19; x <= 25; x++) O(x, y);
        I(18, 7); I(17, 8);
      };
      if (st === 'compact') {
        eyes('up'); mouth('flat'); arm(fr % 2 ? 'type' : 'rest', 1); arm(fr % 2 ? 'rest' : 'type', -1); bubble();
        [2, 4].forEach((yy, k) => { const len = (fr + k) % 2 ? 3 : 5; for (let x = 0; x < len; x++) I(20 + x, yy); });
      } else if (st === 'tired') {
        eyes('closed'); O(7, ey + 1); O(10, ey + 1); O(15, ey + 1); O(18, ey + 1); mouth('flat'); arm('droop', 1); arm('droop', -1);
        const d = fr % 2; I(5, top + 4 + d); I(5, top + 5 + d); I(4, top + 5 + d);
      } else {
        eyes('closed'); mouth('o'); arm('droop', 1); arm('droop', -1);
        const w = fr % 2; [[1, 1], [4, 0], [21, 1], [24, 0]].forEach((p) => { I(p[0], p[1] + w); I(p[0] + 1, p[1] + 1 - w); I(p[0] + 2, p[1] + w); });
      }
    }
    return { mascot };
  }
  eng() {
    const C = this.constructor;
    if (!C._E) C._E = C.build();
    return C._E;
  }
  paint(el, st) {
    if (!el || !el.getContext) return;
    const c = el.getContext('2d');
    c.fillStyle = '#D6D7CF';
    c.fillRect(0, 0, el.width, el.height);
    for (let k = 0; k < 4; k++) this.eng().mascot(c, k * 31, 0, 1, st, k, '#1E2022', '#D6D7CF');
  }
  componentDidMount() {
    this.t = setTimeout(() => {
      document.querySelectorAll('canvas[data-pose]').forEach((el) => this.paint(el, el.getAttribute('data-pose')));
    }, 80);
  }
  componentWillUnmount() {
    clearTimeout(this.t);
  }
  renderVals() {
    if (!this.poses) {
      const L = [
        ['compact', 'RIORDINA', 'Mentre Claude compatta il contesto: nel fumetto le righe si accorciano.'],
        ['tired', 'STANCA', 'Limite delle 5 ore oltre il 90%: occhi socchiusi e una goccia di sudore.'],
        ['stuffy', 'ARIA VIZIATA', 'CO₂ sopra 1000 ppm: bocca aperta e aria che ondeggia.']
      ];
      this.poses = L.map((r) => ({ id: r[0], label: r[1], text: r[2], ref: (el) => this.paint(el, r[0]) }));
      const BG = { sl: '#2646C4', hook: '#1E2022', pc: '#56606B', hw: '#7A5A12' };
      const F = [
        ['Limiti 5 ore e 7 giorni', 'Quota usata e ora del reset. In barra «5h 62%»; sugli schermi piccoli un’icona oltre l’80%.', 'sl', 'Status line · rate_limits', 'Menu › Limiti · solo piani Pro e Max'],
        ['Contesto', 'Quanto contesto occupa ogni sessione. Mentre Claude compatta, la Goccia riordina.', 'sl', 'Status line · PreCompact', 'Dettaglio · Menu › Limiti'],
        ['Riepilogo di fine turno', 'Una frase dall’ultima risposta di Claude, sotto la sessione che ha finito.', 'hook', 'Hook Stop', 'Home · Dettaglio'],
        ['Test e build', 'Esito dell’ultimo test o build lanciato da Claude: passati o falliti.', 'hook', 'Hook PostToolUse', 'Home · Dettaglio'],
        ['Subagenti', 'Quanti subagenti lavorano per ogni sessione, per esempio «+2 agenti».', 'hook', 'Hook SubagentStart e Stop', 'Home · Dettaglio'],
        ['Oggi', 'Sei riquadri: task, permessi, attesa media, righe aggiunte e tolte, costo stimato ai prezzi API.', 'sl', 'Status line · cost', 'Menu › Oggi'],
        ['Riepilogo a PC spento', 'Lo schermo si ferma su cosa è finito, chi ti aspettava e l’ultimo messaggio. L’e‑ink lo tiene senza corrente.', 'hw', 'Scheda', 'Al posto della Home'],
        ['Concentrazione', 'Timer da 25 minuti: avvisi in silenzio, un aggiornamento al minuto, clessidra in barra.', 'hw', 'Scheda', 'Strumenti › Concentrazione'],
        ['Agenda', 'Il prossimo appuntamento nella Home, il resto della giornata nel menu.', 'pc', 'Servizio PC · calendario ICS', 'Strumenti › Agenda'],
        ['Servizi e PR', 'Quali siti rispondono e lo stato dei controlli sulle tue pull request.', 'pc', 'Servizio PC · gh', 'Strumenti › Servizi e PR'],
        ['Wi‑Fi ospiti', 'QR della rete ospiti: si inquadra col telefono e si entra senza scrivere la password.', 'hw', 'Scheda', 'Strumenti › Wi‑Fi ospiti'],
        ['Ambiente', 'CO₂, temperatura e umidità. Oltre 1000 ppm la Goccia chiede aria.', 'hw', 'Sensore I²C', 'Strumenti › Ambiente · barra di stato']
      ];
      this.features = F.map((r) => ({ name: r[0], text: r[1], bg: BG[r[2]], src: r[3], where: r[4] }));
    }
    return { poses: this.poses, features: this.features };
  }
}
