; SPIKE usa e getta · blepad: controller Xbox Series X|S (modello 1914) via Bluetooth LE + convivenza Wi-Fi.
; Progetto separato dal firmware Calamaio: non tocca firmware/ né service/.
; Stessa piattaforma, scheda e tabella partizioni del firmware principale (default_8MB.csv del core Arduino):
; caricare solo l'app a 0x10000 lascia intatte NVS (0x9000), spiffs e coredump. Vedi README.md.

[platformio]
default_envs = heltec213

[env]
monitor_speed = 115200
test_framework = unity

; Heltec Wireless Paper V1.2 · come firmware/platformio.ini (env heltec213)
[env:heltec213]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D BLEPAD_SPIKE
  ; NimBLE: solo il ruolo centrale (niente server/advertising), un solo controller
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1

; Test della parte pura (lettura del report HID, mappatura menu, statistiche)
[env:native]
platform = native
build_src_filter = -<*> +<xbox_report.cpp> +<menu_map.cpp> +<stats.cpp>
test_build_src = yes
build_flags = -std=c++17
