; SPIKE usa e getta · fastink: waveform corta + budget per pixel sul pannello E0213A367.
; Progetto separato dal firmware Calamaio: non tocca firmware/ né service/.
; Stessa piattaforma, scheda e tabella partizioni del firmware principale (default_8MB.csv del core Arduino):
; caricare solo l'app a 0x10000 lascia intatte NVS (0x9000), spiffs e coredump. Vedi README.md.

[platformio]
default_envs = heltec213

[env]
monitor_speed = 115200
test_framework = unity

; Heltec Wireless Paper V1.2 · come firmware/platformio.ini (env heltec213)
[env:heltec213]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D FASTINK_SPIKE

; Test della parte pura (motore a budget, codifica dei piani, LUT, disegno)
[env:native]
platform = native
build_src_filter = -<*> +<engine.cpp> +<lut.cpp> +<canvas.cpp>
test_build_src = yes
build_flags = -std=c++17
